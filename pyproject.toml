[project]
name = "gfs-sim-coaching-agent"
version = "0.1.0"
description = "Gordon Food Service (GFS) Sales Insight Manager (SIM) Cross-Project BigQuery + Google Drive ADK/A2A Demo Agent with End-User 3LO OAuth Passthrough"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.35.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
